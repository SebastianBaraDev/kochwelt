<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt</title>

  <link rel="icon" type="image/png" sizes="32x32" href="./img/logo_small.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="./style/style.css">
  <link rel="stylesheet" href="./style/basic.css">
  <link rel="stylesheet" href="./style/responsive.css">

  <script src="./javascript/menu_window.js"></script>
  <script src="./javascript/contact.js"></script>
</head>

<body>
  <header>
    <div class="wrapper_container">
      <div class="header_layout">
        <a href="./index.html"><img src="./img/logo.png" class="header_logo" /></a>
        <a href="./index.html" class="header_logo_mobile"><img src="./img/logo_small.png"
            class="header_logo_mobile" /></a>
        <nav>
          <ul class="nav_list">
            <li><a href="./index.html">Startseite</a></li>
            <li><a href="./rezept_des_tages.html">Rezept des Tages</a></li>
            <li><a href="./contact.html">Kontakt</a></li>
            <li><a href="./impressum.html">Impressum</a></li>
          </ul>
        </nav>
        <!-- Mobile Menu -->
        <div class="nav-mobile">
          <button class="burger" onclick="toggleMenu()">☰</button>
          <ul id="mobileMenu" class="mobile-menu">
            <li><a href="./index.html">Startseite</a></li>
            <li><a href="./rezept_des_tages.html">Rezept des Tages</a></li>
            <li><a href="./contact.html">Kontakt</a></li>
            <li><a href="./impressum.html">Impressum</a></li>
          </ul>
        </div>
      </div>
    </div>
  </header>
<hr>
  <main>
    <section class="contact_formular">
      <div class="wrapper_container">
        <div class="contact_layout">
          <form onsubmit="sendMail(event)" class="contact_form">
            <h3>Kontaktiere uns</h3><br>
            <label for="name">Ihr Name:</label><br>
            <input type="text" required><br>

            <label for="email">Ihre E-Mail:</label><br>
            <input type="email" required><br>

            <label for="message">Ihre Nachtricht:</label><br>
            <textarea name="message" id="message" rows="4" cols="50" required></textarea><br>

            <button type="submit">Senden</button><br>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrapper_container">
      <div class="footer_layout">
        <img src="./img/logo.png" class="footer_logo" />
        <img src="./img/logo_small.png" class="footer_logo_small" />
        <div>
          <div class="footer_social">
            <a href="https://facebook.com" class="footer_social_a"><img src="./img/facebook_white.png"
                class="social_icon"></a>
            <a href="https://instagram.com" class="footer_social_a"><img src="./img/instagram_white.png"
                class="social_icon"></a>
            <a href="https://x.com" class="footer_social_a"><img src="./img/twitter_white.png" class="social_icon"></a>
          </div>
          <div class="footer_links">
            <a href="./impressum.html">Impressum</a>
            <a href="./datenschutz.html">Datenschutz</a>
          </div>
        </div>
      </div>
    </div>
  </footer>
</body>

</html>
